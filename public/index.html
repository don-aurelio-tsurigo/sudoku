<!DOCTYPE html>
<html lang="de-CH" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Sudoku</title>
  <link rel="preload" href="fonts/space-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>" />
</head>
<body>
  <div class="app">
    <header class="top">
      <h1 class="logo">Sudoku</h1>
      <div class="top-actions">
        <button class="icon-btn" id="btn-theme" title="Hell / Dunkel" aria-label="Hell oder dunkel">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" id="btn-pause" title="Pause" aria-label="Pause">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button class="pill-btn" id="btn-new" title="Neues Spiel">Neues Spiel</button>
      </div>
    </header>

    <div class="hud">
      <div class="stat"><span class="label">Stufe</span><span class="value" id="difficulty">–</span></div>
      <div class="stat"><span class="label">Zeit</span><span class="value" id="timer">0:00</span></div>
      <div class="stat"><span class="label">Fehler</span><span class="value" id="mistakes">0</span></div>
      <div class="stat"><span class="label">Tipps</span><span class="value" id="hints-left">3</span></div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Sudoku-Feld"></div>
    </div>

    <div class="pad" id="pad"></div>

    <div class="toolbar">
      <button class="tool" id="btn-undo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Zurück</button>
      <button class="tool" id="btn-erase">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><path d="m18 9-6 6M12 9l6 6"/></svg>Löschen</button>
      <button class="tool" id="btn-notes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Notizen<span class="badge" id="notes-badge" hidden>AN</span></button>
      <button class="tool" id="btn-hint">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>Tipp</button>
    </div>
  </div>

  <!-- Neues Spiel -->
  <div class="overlay" id="ov-new">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-title">
      <h2 id="new-title">Neues Spiel</h2>
      <p class="modal-subtitle">Wähle die Schwierigkeit.</p>
      <div class="diff-grid">
        <button class="diff-btn" data-diff="easy">Leicht <span class="dots"><b>●</b>○○○</span></button>
        <button class="diff-btn" data-diff="medium">Mittel <span class="dots"><b>●●</b>○○</span></button>
        <button class="diff-btn" data-diff="hard">Schwer <span class="dots"><b>●●●</b>○</span></button>
        <button class="diff-btn" data-diff="expert">Experte <span class="dots"><b>●●●●</b></span></button>
      </div>
      <button class="link-btn" id="btn-cancel-new" hidden>Abbrechen</button>
    </div>
  </div>

  <!-- Pause -->
  <div class="overlay" id="ov-pause">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pause-title">
      <h2 id="pause-title">Pause</h2>
      <p class="modal-subtitle">Das Rätsel wartet auf dich.</p>
      <button class="cta" id="btn-resume">Weiterspielen</button>
    </div>
  </div>

  <!-- Gewonnen -->
  <div class="overlay" id="ov-win">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <h2 id="win-title">Geschafft! 🎉</h2>
      <p class="modal-subtitle" id="win-quip">Gut gemacht.</p>
      <div class="win-stats">
        <div><span class="label">Zeit</span><span class="value" id="win-time">–</span></div>
        <div><span class="label">Fehler</span><span class="value" id="win-mistakes">–</span></div>
        <div><span class="label">Tipps</span><span class="value" id="win-hints">–</span></div>
      </div>
      <button class="cta" id="btn-again">Nochmals spielen</button>
    </div>
  </div>

  <canvas id="fx"></canvas>

  <script src="sudoku.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
